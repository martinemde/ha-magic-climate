[project]
name = "magic-climate"
version = "0.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
# The climate tests run inside a real Home Assistant event loop; HA's test
# helper expects pytest-asyncio in auto mode so async test functions are
# collected without per-test markers.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".venv"]
